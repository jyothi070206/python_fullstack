<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Register page</title>
</head>
<body>
    <header>Register</header>
    <main>
        <h2> student Registration</h2>
        <form>
            <label>Full name</label>
            <input type="text" placeholder="Enter your name"><br><br>
            <label>Email</label>
            <input type="email" placeholder="Enter your email"><br><br>
            <label>Date of Birth</label>
            <input type="date" placeholder="Enter your date of birth"><br><br>
            <label>Phone Number</label>
            <input type="text" placeholder="Enter your phone number"><br><br>
            <label>Gender</label>
            <select>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select><br><br>
            <label>Select Course</label>
            <select>
                <option value="Python">Course 1</option>
                <option value="JavaScript">Course 2</option>
                <option value="Java">Course 3</option>
            </select><br><br>
            <label>Password</label>
            <input type="password" placeholder="Enter your password"><br><br>
            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm your password"><br><br>
            <button type="submit">Register</button>


        </form>
    </main>
